<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAJI CV PRO - OVERLORD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#111;color:#fff;padding:15px}
.container{max-width:600px;margin:auto}
h1{text-align:center;margin:15px 0;color:#00ff88}
.card{background:#222;padding:15px;border-radius:12px;margin-bottom:15px;border:1px solid #333}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;background:#333;color:#fff}
label{font-size:13px;color:#aaa;margin-top:8px;display:block}
button{width:100%;padding:15px;background:#00ff88;color:#000;font-weight:bold;border:none;border-radius:10px;margin-top:10px;font-size:16px}
.output{display:none;background:#fff;color:#000;padding:15px;border-radius:10px;margin-top:20px}
.output h2{border-bottom:2px solid #000;padding-bottom:5px;margin:15px 0 10px}
.badge{display:inline-block;background:#000;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;margin:2px}
@media print{body *{visibility:hidden}.output,.output *{visibility:visible}.output{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div class="container">
<h1>⚡ BAJI CV PRO</h1>

<div class="card">
<label>Nom complet</label>
<input id="nom" value="KILIAN BAJI">
<label>Poste visé</label>
<input id="poste" value="Développeur">
<label>Ville</label>
<input id="ville" value="Kinshasa">
<label>Téléphone</label>
<input id="tel" value="+243 82XXXXX">
<label>Email</label>
<input id="email" value="baji@email.com">
<label>Formation</label>
<input id="formation" value="2023 - UNIKIN - Informatique">
<label>Compétences (séparées par virgule)</label>
<input id="skills" value="HTML,CSS,JavaScript,Python">
<label>Parcours / Expérience</label>
<textarea id="parcours">Rgcb - Passionné par le code et la cybersécurité</textarea>
<button onclick="generer()">🔥 GÉNÉRER MON CV + LETTRES</button>
</div>

<div id="result" class="output"></div>
</div>

<script>
function generer(){
let n=document.getElementById('nom').value;
let p=document.getElementById('poste').value;
let v=document.getElementById('ville').value;
let t=document.getElementById('tel').value;
let e=document.getElementById('email').value;
let f=document.getElementById('formation').value;
let s=document.getElementById('skills').value.split(',');
let pa=document.getElementById('parcours').value;

let badges=s.map(x=>`<span class="badge">${x.trim()}</span>`).join('');

document.getElementById('result').innerHTML=`
<h2>${n} - ${p}</h2>
<p><b>Ville:</b> ${v} | <b>Tel:</b> ${t} | <b>Email:</b> ${e}</p>

<h2>FORMATIONS</h2>
<p>${f}</p>

<h2>COMPÉTENCES</h2>
<p>${badges}</p>

<h2>LETTRE DE MOTIVATION 1 - CLASSIQUE</h2>
<p><b>Objet: Candidature au poste de ${p}</b></p><br>
<p>Madame, Monsieur,</p><br>
<p>Passionné(e) par le domaine de ${p}, je souhaite vous soumettre ma candidature.</p><br>
<p>${pa}</p><br>
<p>Mon expérience et ma motivation font de moi un candidat idéal pour rejoindre votre équipe.</p><br>
<p>Disponible à ${v}, joignable au ${t}.</p><br>
<p>Veuillez agréer l'expression de mes salutations distinguées.</p><br>
<p><b>${n}</b></p>

<h2>LETTRE DE MOTIVATION 2 - MODERNE & PERCUTANTE</h2>
<p style="border-left:3px solid #000;padding-left:10px">
<b>POURQUOI MOI?</b><br>
Je ne cherche pas juste un emploi. Je veux transformer votre vision en résultats.<br><br>
<b>Expertise:</b> ${p} avec énergie<br>
<b>Preuve:</b> ${pa}<br>
<b>Langues:</b> FR + EN<br><br>
Mon expérience et ma motivation font de moi un candidat idéal pour rejoindre votre équipe.<br><br>
Contact direct: ${t} / ${e}<br><br>
<b>${n} - OVERLORD</b>
</p>
<br><br>
<button onclick="window.print()" style="background:#000;color:#fff">📄 IMPRIMER / SAUVER EN PDF</button>
`;
document.getElementById('result').style.display='block';
window.scrollTo(0,document.body.scrollHeight);
}
</script>
</body>
</html>
